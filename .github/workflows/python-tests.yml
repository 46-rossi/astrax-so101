
name: AstraX Python Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test SO-101 Reference Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m compileall -q nwaves_hackathon scripts tests

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v
